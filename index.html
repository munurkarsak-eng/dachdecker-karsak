<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dachdecker Karsak – Dachaufmaß</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#20262e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dachaufmaß">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf0f3;color:#1f2937}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding:18px}
.header{text-align:center;padding:8px 0 20px}.logo{width:68px;height:68px;border-radius:18px;background:#20262e;color:#fff;display:grid;place-items:center;margin:auto;font-size:34px}
h1{margin:10px 0 3px;font-size:27px}.sub{color:#6b7280;font-size:14px}.pageTitle{font-size:22px;font-weight:800;margin:14px 0}
button{font:inherit;cursor:pointer}.big{width:100%;padding:20px;border:2px solid #e1e5e9;border-left:8px solid #374151;border-radius:16px;background:#fff;text-align:left;margin:0 0 14px;box-shadow:0 4px 12px #0001}
.big .n{font-size:21px;font-weight:800}.big .d{font-size:13px;color:#6b7280;margin-top:4px}.back{border:1px solid #d1d5db;background:#f8fafc;padding:10px 12px;border-radius:11px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.roof{border:2px solid #e5e7eb;background:white;border-radius:15px;padding:10px;min-height:135px}.roof svg{width:100%;height:77px}.roofName{font-weight:800}
.panel{background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:14px}
.help{font-size:13px;color:#5f6875;line-height:1.45;margin:6px 0 14px}
.field{margin:12px 0}.field label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}.row{display:flex;align-items:center;gap:8px}
input,select{width:100%;padding:13px;border:2px solid #d5dae0;border-radius:11px;background:#fff;font-size:17px}.suffix{min-width:34px;font-weight:700}
.unitSwitch{display:flex;gap:8px}.unitSwitch button{flex:1;padding:11px;border:2px solid #d1d5db;background:#fff;border-radius:11px;font-weight:800}.unitSwitch .active{background:#20262e;color:#fff;border-color:#20262e}
.calc{width:100%;padding:15px;border:0;border-radius:12px;background:#20262e;color:#fff;font-size:17px;font-weight:800;margin-top:15px}
.result{display:none;background:#fff;border:2px solid #cfd5dc;border-radius:14px;padding:15px;margin-top:15px;line-height:1.7}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:10px;margin-top:10px;font-size:12px;line-height:1.4}
.hidden{display:none}.footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:25px}
@media(max-width:410px){.grid{grid-template-columns:1fr}}

.drawingBox{background:#fff;border:2px solid #d7dce2;border-radius:16px;padding:12px;margin-top:14px}
.drawingTitle{font-weight:800;margin-bottom:7px}
.drawingBox svg{display:block;width:100%;height:auto;max-height:300px}
.dim{stroke:var(--viz-accent,#374151);stroke-width:2;fill:none}
.dimText{font-size:13px;font-weight:700;fill:currentColor}
.roofLine{stroke:currentColor;stroke-width:4;fill:none;stroke-linejoin:round}
.guide{stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.key{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;font-size:13px}
.key div{background:#f3f4f6;border-radius:9px;padding:7px 9px}
@media(max-width:410px){.key{grid-template-columns:1fr}}

.viewToggle{display:flex;gap:8px;margin:10px 0}
.viewToggle button{flex:1;padding:11px;border:2px solid #d1d5db;background:#fff;border-radius:11px;font-weight:800}
.viewToggle button.active{background:#20262e;color:#fff;border-color:#20262e}
.viewPane.hiddenView{display:none}

.flatDrawWrap{margin-top:14px}
.flatTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.flatTools button{padding:11px;border:2px solid #d1d5db;background:#fff;border-radius:11px;font-weight:800}
.flatTools button.primary{background:#20262e;color:#fff;border-color:#20262e}
.flatCanvas{width:100%;background:#fff;border:2px solid #cfd5dc;border-radius:14px;touch-action:none}
.flatHint{font-size:12px;color:#6b7280;line-height:1.45;margin-top:8px}
.flatStatus{margin-top:10px;padding:10px;border-radius:10px;background:#f3f4f6;font-size:13px;line-height:1.45}

.edgeMeasureBox{margin-top:12px}
.edgeMeasureBox h3{margin:0 0 8px;font-size:16px}
.edgeGrid{display:grid;gap:8px}
.edgeRow{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center}
.edgeLabel{font-weight:700;font-size:13px}
.edgeInput{padding:11px;border:2px solid #d5dae0;border-radius:10px;font-size:16px;width:100%}
.edgeHint{font-size:12px;color:#6b7280;line-height:1.4;margin-top:8px}
.edgeActive{stroke:var(--viz-accent,#111827)!important;stroke-width:6!important}
@media(max-width:410px){.edgeRow{grid-template-columns:95px 1fr 30px}}

.measureHelpBtn{margin-top:6px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px}
.measureHelp{display:none;margin-top:8px;background:#fff;border:1px solid #d7dce2;border-radius:12px;padding:9px}
.measureHelp.open{display:block}.measureHelp svg{width:100%;height:auto;display:block}
.measureHelpText{font-size:12px;line-height:1.4;margin-top:5px;color:#4b5563}
.hl{stroke:#111827;stroke-width:7;fill:none}.baseRoof{stroke:#9ca3af;stroke-width:3;fill:none}

.beginnerHelp{display:none;margin-top:10px;border:2px solid #d1d5db;border-radius:14px;background:#fff;padding:12px}
.beginnerHelp.open{display:block}
.beginnerHelpTitle{font-size:17px;font-weight:800;margin-bottom:8px}
.beginnerHelp svg{width:100%;height:auto;display:block;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}
.beginnerSteps{margin-top:10px;display:grid;gap:7px}
.beginnerStep{background:#f3f4f6;border-radius:9px;padding:9px;font-size:13px;line-height:1.4}
.beginnerStep b{display:block;margin-bottom:2px}
.beginnerBtn{margin-top:6px;border:2px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;font-size:13px;width:100%}
.bigMeasureText{font-size:16px;font-weight:800;fill:currentColor}

.compactField{display:grid;grid-template-columns:92px 34px 1fr;gap:8px;align-items:center;margin:10px 0}
.compactField input{width:92px;padding:10px 8px;font-size:16px}
.compactField .compactUnit{font-weight:700;font-size:14px}
.compactField .compactLabel{font-weight:700;font-size:14px;line-height:1.25}
.compactField .compactHelp{grid-column:3;margin-top:2px}
.compactField .beginnerBtn{margin:0;width:auto;padding:7px 9px;font-size:12px}
.compactField .beginnerHelp{grid-column:1 / -1}
@media(max-width:390px){
  .compactField{grid-template-columns:82px 30px 1fr}
  .compactField input{width:82px}
  .compactField .compactLabel{font-size:13px}
}

.flatFormSketch{margin:10px 0 14px;border:2px solid #d7dce2;border-radius:14px;padding:10px;background:#fff}
.flatFormSketch svg{width:100%;height:auto;display:block}
.flatTip{font-size:12px;line-height:1.4;background:#f3f4f6;border-radius:9px;padding:8px;margin-top:8px}
.flatDim{stroke:#111827;stroke-width:5;fill:none}
.flatShapeLine{stroke:#6b7280;stroke-width:3;fill:none}
.flatDimText{font-size:15px;font-weight:800;fill:currentColor}

.extraMeasure{margin-top:14px;border-top:2px solid #e5e7eb;padding-top:12px}
.extraMeasureTitle{font-weight:800;font-size:16px;margin-bottom:4px}
.extraMeasureNote{font-size:12px;color:#6b7280;margin-bottom:8px;line-height:1.4}

.flatObjectTools{margin-top:14px;border-top:2px solid #e5e7eb;padding-top:12px}
.flatObjectToolsTitle{font-weight:800;margin-bottom:8px}
.flatObjectButtons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.flatObjectButtons button{padding:10px 8px;border:2px solid #d1d5db;background:#fff;border-radius:10px;font-weight:800;font-size:12px}
.flatObjectButtons button.active{background:#20262e;color:#fff;border-color:#20262e}
.objectList{margin-top:10px;font-size:12px;line-height:1.5;background:#f3f4f6;border-radius:9px;padding:8px}
.objGully{fill:#111827;stroke:#111827}.objVent{fill:none;stroke:#111827;stroke-width:3}.objAttika{fill:#fff;stroke:#111827;stroke-width:4}
@media(max-width:390px){.flatObjectButtons{grid-template-columns:1fr}}

.placePanel{margin-top:14px;border:2px solid #d7dce2;border-radius:14px;padding:12px;background:#fff}
.placeTitle{font-weight:800;font-size:17px;margin-bottom:8px}
.placeTools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.placeTools button{padding:9px 7px;border:2px solid #d1d5db;background:#fff;border-radius:10px;font-weight:800;font-size:12px}
.placeTools button.active{background:#20262e;color:#fff;border-color:#20262e}
.placeSketch{width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}
.placeEdge{stroke:#6b7280;stroke-width:8;fill:none;cursor:pointer}
.placeEdge.selected{stroke:#111827;stroke-width:12}
.placePoint{fill:#111827}
.placeLabel{font-size:13px;font-weight:800;fill:currentColor}
.placeInputs{display:none;margin-top:10px}
.placeInputs.open{display:block}
.placeRow{display:grid;grid-template-columns:90px 34px 1fr;gap:8px;align-items:center;margin:8px 0}
.placeRow input{width:90px;padding:9px 7px;font-size:15px}
.placeHint{font-size:12px;line-height:1.4;color:#6b7280;margin-top:7px}
.placeList{margin-top:10px;background:#f3f4f6;border-radius:9px;padding:8px;font-size:12px;line-height:1.5}
@media(max-width:390px){.placeTools{grid-template-columns:1fr}.placeRow{grid-template-columns:80px 30px 1fr}.placeRow input{width:80px}}

.slopePanel{margin-top:16px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.slopeTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.slopeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slopeField{margin:8px 0}.slopeField label{display:block;font-weight:800;font-size:13px;margin-bottom:4px}
.slopeField select,.slopeField input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff}
.slopePlan{margin-top:12px;border:1px solid #d7dce2;border-radius:12px;background:#fafafa;padding:8px}
.slopePlan svg{width:100%;height:auto;display:block}
.slopeResult{margin-top:10px;background:#f3f4f6;border-radius:10px;padding:10px;font-size:13px;line-height:1.5}
@media(max-width:480px){.slopeGrid{grid-template-columns:1fr}}

.energyBox{margin-top:12px;border-top:2px solid #e5e7eb;padding-top:12px}
.energyTitle{font-size:17px;font-weight:900;margin-bottom:8px}
.energyMetrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.energyMetric{border:1px solid #d7dce2;border-radius:10px;padding:9px;background:#fff}
.energyMetric .k{font-size:12px;color:#6b7280}.energyMetric .v{font-size:18px;font-weight:900;margin-top:2px}
.energyStatus{margin-top:9px;border-radius:10px;padding:10px;font-weight:800}
.energyStatus.ok{background:#ecfdf5}.energyStatus.mid{background:#fffbeb}.energyStatus.bad{background:#fef2f2}
@media(max-width:430px){.energyMetrics{grid-template-columns:1fr}}

.buildPanel{margin-top:16px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.buildTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.buildGroup{margin-top:12px}
.buildGroupTitle{font-weight:800;font-size:15px;margin-bottom:7px}
.buildChoices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buildChoice{border:2px solid #d1d5db;background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:800;font-size:13px}
.buildChoice.active{background:#20262e;color:#fff;border-color:#20262e}
.buildLayerInputs{margin-top:10px;display:grid;gap:8px}
.buildLayerRow{display:grid;grid-template-columns:1fr 90px 70px;gap:8px;align-items:center}
.buildLayerRow input{width:90px;padding:9px;border:1px solid #cbd5e1;border-radius:9px}
.buildSummary{margin-top:10px;background:#f3f4f6;border-radius:10px;padding:10px;font-size:13px;line-height:1.5}
@media(max-width:450px){
 .buildChoices{grid-template-columns:1fr}
 .buildLayerRow{grid-template-columns:1fr 80px 60px}
 .buildLayerRow input{width:80px}
}

.reportActions{margin-top:18px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.reportActionsTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.reportBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.reportBtns button{padding:12px;border:0;border-radius:10px;font-weight:900;font-size:14px}
.reportBtns .pdfBtn{background:#20262e;color:#fff}
.reportBtns .printBtn{background:#e5e7eb;color:#111827}
.printReport{display:none}
@media(max-width:430px){.reportBtns{grid-template-columns:1fr}}
@media print{
  body{background:#fff!important;color:#000!important;margin:0!important;padding:0!important}
  body > *:not(#printReport){display:none!important}
  #printReport{
    display:block!important;
    position:static!important;
    width:auto!important;
    margin:0!important;
    padding:0!important;
    background:#fff!important;
    color:#000!important;
  }
  #printReport *{visibility:visible!important}
  #printReport h1{font-size:20pt;margin:0 0 4mm}
  #printReport h2{font-size:14pt;margin:6mm 0 2mm;border-bottom:1px solid #999;padding-bottom:1mm;break-after:avoid}
  #printReport table{width:100%;border-collapse:collapse;margin:2mm 0 5mm;break-inside:avoid}
  #printReport td,#printReport th{border:1px solid #bbb;padding:2mm;text-align:left;vertical-align:top;font-size:10pt}
  #printReport .small{font-size:9pt}
  #printReport .printSketch{width:100%;max-height:90mm;display:block;margin:2mm 0 5mm;break-inside:avoid}
  #printReport .printSection{break-inside:avoid}
  #printReport .printBlock{border:1px solid #bbb;padding:3mm;margin:2mm 0 5mm;break-inside:avoid;font-size:10pt;line-height:1.45}
  #printReport button{display:none!important}
  @page{size:A4;margin:12mm}
}

.edgeClassBox{margin-top:14px;border-top:2px solid #e5e7eb;padding-top:12px}
.edgeClassTitle{font-size:17px;font-weight:900;margin-bottom:5px}
.edgeClassRow{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin:8px 0;padding:8px;background:#fff;border:1px solid #e5e7eb;border-radius:9px}
.edgeClassRow select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.edgeTotals{margin-top:9px;background:#f3f4f6;border-radius:9px;padding:9px;font-size:13px;line-height:1.5}

.projectBox{margin-top:14px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.projectTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.projectGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.projectField{margin-top:8px}
.projectField label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}
.projectField input,.projectField textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff}
.projectField textarea{min-height:65px;resize:vertical}
@media(max-width:480px){.projectGrid{grid-template-columns:1fr}}

.projectBox.requiredBox{border:3px solid #d00000;box-shadow:0 0 0 2px rgba(208,0,0,.08)}
.requiredHeadline{font-weight:900;color:#b00000;margin:4px 0 8px;font-size:13px}
.projectField.requiredField label::after{content:" *";color:#d00000;font-weight:900}
.projectField.requiredField input{border:2px solid #d00000;background:#fffafa}
.projectField.requiredField input:focus{outline:2px solid rgba(208,0,0,.18)}
.projectField.requiredField input.validRequired{border-color:#15803d;background:#f7fff9}
.requiredError{display:none;color:#b00000;font-weight:800;font-size:12px;margin-top:4px}
.requiredError.show{display:block}

.steepBuild{margin-top:16px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.steepBuildTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.steepGroup{margin-top:12px}
.steepGroupTitle{font-weight:800;font-size:15px;margin-bottom:7px}
.steepChoices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steepChoice{border:2px solid #d1d5db;background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:800;font-size:13px}
.steepChoice.active{background:#20262e;color:#fff;border-color:#20262e}
.steepRows{display:grid;gap:8px;margin-top:8px}
.steepRow{display:grid;grid-template-columns:90px 34px 1fr;gap:8px;align-items:center}
.steepRow input{width:90px;padding:9px;border:1px solid #cbd5e1;border-radius:9px}
.steepResult{margin-top:10px;background:#f3f4f6;border-radius:10px;padding:10px;font-size:13px;line-height:1.5}
@media(max-width:430px){.steepChoices{grid-template-columns:1fr}.steepRow{grid-template-columns:80px 30px 1fr}.steepRow input{width:80px}}

.fixPanel{margin-top:14px;border-top:2px solid #e5e7eb;padding-top:12px}
.fixTitle{font-size:17px;font-weight:900;margin-bottom:6px}
.fixGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fixField label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}
.fixField select,.fixField input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
.fixResult{margin-top:9px;padding:10px;background:#f3f4f6;border-radius:10px;font-size:13px;line-height:1.5}
@media(max-width:430px){.fixGrid{grid-template-columns:1fr}}

:root{--selected-green:#15803d;--selected-green-bg:#ecfdf5}
.steepChoice.active,.buildChoice.active{
 background:var(--selected-green)!important;
 border-color:var(--selected-green)!important;
 color:#fff!important;
}
select.chosenGreen{
 border:2px solid var(--selected-green)!important;
 background:var(--selected-green-bg)!important;
 color:#14532d!important;
 font-weight:800!important;
}

.techReport{font-family:Arial,Helvetica,sans-serif}
.techHeader{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #222;padding-bottom:5mm;margin-bottom:5mm}
.techHeader h1{margin:0;font-size:20pt}
.techMeta{text-align:right;font-size:9pt;line-height:1.4}
.techSection{margin-top:5mm}
.techSection h2{font-size:13pt;margin:0 0 2mm;padding-bottom:1mm;border-bottom:1px solid #777}
.techTable{width:100%;border-collapse:collapse;margin-top:2mm}
.techTable th,.techTable td{border:1px solid #aaa;padding:2.2mm;font-size:9.5pt;vertical-align:top}
.techTable th{background:#f2f2f2;font-weight:700}
.techSketchWrap{border:1px solid #aaa;padding:3mm;margin-top:2mm}
.techCalc{background:#f7f7f7;border-left:4px solid #444;padding:3mm;margin-top:2mm;font-size:9.5pt;line-height:1.5}
.techResult{border:2px solid #222;padding:3mm;margin-top:3mm;font-size:11pt;font-weight:700}
.techNote{font-size:8.5pt;line-height:1.4;margin-top:4mm}
@media print{
 .techTable tr,.techTable td,.techTable th{break-inside:avoid}
 .techSection{break-inside:avoid}
 .techSketchWrap{break-inside:avoid}
 .techResult{break-inside:avoid}
}

.materialPanel{margin-top:16px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}
.materialTitle{font-size:19px;font-weight:900;margin-bottom:5px}
.materialGroup{margin-top:12px}
.materialGroupTitle{font-weight:800;font-size:15px;margin-bottom:6px}
.materialChoices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.materialChoice{border:2px solid #d1d5db;background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:800;font-size:13px}
.materialChoice.active{background:#15803d;color:#fff;border-color:#15803d}
.materialInfo{margin-top:8px;padding:9px;background:#f3f4f6;border-radius:9px;font-size:12px;line-height:1.45}
.materialQty{margin-top:10px;padding:10px;background:#f7f7f7;border-radius:10px;font-size:13px;line-height:1.5}
@media(max-width:430px){.materialChoices{grid-template-columns:1fr}}

.matCategory{margin-top:9px;border:2px solid #d1d5db;border-radius:11px;overflow:hidden;background:#fff}
.matCategoryBtn{width:100%;border:0;background:#20262e;color:#fff;padding:12px;text-align:left;font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.matCategoryBtn.selected{background:#15803d}
.matCategoryBody{display:none;padding:10px;background:#fafafa}
.matCategoryBody.open{display:block}
.matSelectedText{font-size:12px;font-weight:700;opacity:.9;margin-left:8px}

.drainPanel{margin-top:16px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}

.dormerPanel{margin-top:14px;border:2px solid #cfd6de;border-radius:14px;padding:12px;background:#fff}

.recentBox{margin-top:18px;border-top:2px solid #e5e7eb;padding-top:14px}
.recentTitle{font-size:19px;font-weight:900;margin-bottom:8px}
.recentEmpty{font-size:13px;color:#6b7280;background:#f3f4f6;border-radius:10px;padding:10px}
.recentList{display:grid;gap:9px}
.recentItem{border:2px solid #d1d5db;border-radius:12px;background:#fff;padding:11px}

.saveProjectBtn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#15803d;color:#fff;font-weight:900}

.recentItem.completed{border:3px solid #15803d;background:#f0fdf4}
.recentItem.incomplete{border:3px solid #dc2626;background:#fef2f2}

function setUnit(u){

}

function deriveSteepGeometry(){
 const roof=currentRoof||'';
 const A=parseFloat(document.getElementById('A')?.value)||0;
 const B=parseFloat(document.getElementById('B')?.value)||0;
 const D=parseFloat(document.getElementById('D')?.value)||0;
 const C=parseFloat(document.getElementById('C')?.value)||0;

 let area=0, rafter=0, gutter=0, eavesSheet=0, ridge=0;

 if(roof==='Satteldach' && A>0 && B>0 && D>0){
   rafter=(A/2)/Math.cos(D*Math.PI/180);
   area=2*B*rafter;
   gutter=2*B;
   eavesSheet=gutter;
   ridge=B;
 }
 else if(roof==='Pultdach' && A>0 && B>0 && D>0){
   rafter=A/Math.cos(D*Math.PI/180);
   area=B*rafter;
   gutter=B;
   eavesSheet=B;
 }
 else if(roof==='Walmdach' && A>0 && B>0 && D>0){
   const c=Math.cos(D*Math.PI/180);
   area=A*B/c;
   gutter=2*A+2*B;
   eavesSheet=gutter;
   ridge=Math.max(Math.max(A,B)-Math.min(A,B),0);
   rafter=(Math.min(A,B)/2)/c;
 }
 else if(roof==='Zeltdach' && A>0 && B>0 && C>0){
   const sl1=Math.sqrt((A/2)**2+C**2);
   const sl2=Math.sqrt((B/2)**2+C**2);
   area=2*(0.5*B*sl1)+2*(0.5*A*sl2);
   gutter=2*A+2*B;
   eavesSheet=gutter;
   rafter=Math.max(sl1,sl2);
 }
 else if(roof==='Krüppelwalmdach' && A>0 && B>0 && C>0){
   const alpha=Math.atan(C/(A/2));
   area=A*B/Math.cos(alpha); // Grundwert; Sonderwalmkorrektur erfolgt in der Dachberechnung
   gutter=2*B;
   eavesSheet=gutter;
   rafter=(A/2)/Math.cos(alpha);
 }
 else if(A>0 && B>0){
   area=A*B;
 }
 return {area,rafter,gutter,eavesSheet,ridge,A,B,D,C};
}

function calcSteepMaterial(){
 const g=deriveSteepGeometry();
 const area=g.area;
 const box=document.getElementById('materialQty'); if(!box)return;
 const names={
  deltaMaxx:'DELTA-MAXX PLUS',deltaVent:'DELTA-VENT S PLUS',deltaFoxx:'DELTA-FOXX PLUS',otherMembrane:'Andere Dachbahn',
  '4060':'40 × 60 mm S10','3060':'30 × 60 mm','3050':'30 × 50 mm',otherCounter:'Andere Konterlatte',otherBatten:'Andere Traglatte',
  rubin9v:'Braas Rubin 9V',rubin11v:'Braas Rubin 11V',rubin13v:'Braas Rubin 13V',monza:'Röben MONZAplus',creaton:'CREATON',otherTile:'Anderer Ziegel / Dachstein',
  profileWood:'Profilholz',woodBoard:'Holz / Brett',pvcProfile:'PVC-Profil',mammut:'Mammutprofil',
  otherEaves:'Andere Dachkastenausführung',otherVerge:'Andere Windfederausführung',otherFascia:'Andere Stirnbrettausführung'
 };
 let html='<b>Gewählter Materialaufbau</b><br>';
 html+=`Dachbahn: <b>${names[steepMaterials.membrane]||'nicht gewählt'}</b><br>`;
 html+=`Konterlattung: <b>${names[steepMaterials.counter]||'nicht gewählt'}</b><br>`;
 html+=`Traglatten: <b>${names[steepMaterials.battens]||'nicht gewählt'}</b><br>`;
 html+=`Eindeckung: <b>${names[steepMaterials.tile]||'nicht gewählt'}</b><br>`;
 html+=`Dachkasten / Gesimskasten: <b>${names[steepMaterials.eavesBox]||'nicht gewählt'}</b><br>`;
 html+=`Windfeder / Ortgangbekleidung: <b>${names[steepMaterials.verge]||'nicht gewählt'}</b><br>`;
 html+=`Stirnbrett / Traufbrett: <b>${names[steepMaterials.fascia]||'nicht gewählt'}</b><br>`;

 if(area>0){
   const membraneArea=area*1.10;
   html+=`<br><b>Automatisch berechneter Bedarf</b><br>`;
   html+=`Dachfläche: <b>${area.toFixed(2)} m²</b><br>`;
   if(steepMaterials.membrane) html+=`Dachbahn inkl. 10 % Überdeckung/Reserve: <b>${membraneArea.toFixed(2)} m²</b><br>`;

   const spacing=(parseFloat(document.getElementById('rafterSpacing')?.value)||0)/1000;
   if(steepMaterials.counter && spacing>0 && g.B>0 && g.rafter>0 && currentRoof==='Satteldach'){
      const raftersPerSide=Math.ceil(g.B/spacing)+1;
      const counterM=raftersPerSide*g.rafter*2;
      html+=`Konterlatten: <b>ca. ${counterM.toFixed(1)} lfm</b> (${raftersPerSide} Sparren je Dachseite)<br>`;
   }

   if(steepMaterials.tile==='rubin9v'){
     html+=`Rubin 9V: <b>${Math.ceil(area*9.4)}–${Math.ceil(area*10.2)} Stück</b> vor Formziegeln/Verschnitt.<br>`;
   } else if(steepMaterials.tile){
     html+=`Dachziegelmenge: <b>Herstellerbedarf des gewählten Modells × ${area.toFixed(2)} m²</b>.<br>`;
   }

   if(g.gutter) html+=`Dachrinne: <b>${g.gutter.toFixed(2)} m</b><br>`;
   if(g.eavesSheet) html+=`Einhangblech / Traufblech: <b>${g.eavesSheet.toFixed(2)} m</b><br>`;
 }else{
   html+=`<br><b>Grundmaße zuerst vollständig eingeben.</b>`;
 }
 box.innerHTML=html;

 const info=document.getElementById('autoMaterialInfo');
 if(info)info.innerHTML=autoMaterialInfo();
}

function calcDrainage(){

 const dh=parseFloat(document.getElementById('storeyHeight')?.value)||0;

 let clamps=parseInt(document.getElementById('downClamps')?.value)||0;
 let outlets=parseInt(document.getElementById('outlets')?.value)||0;

 if(!hooks && gl>0) hooks=Math.ceil(gl/0.5)+1;
 if(!clamps && dc>0 && dh>0) clamps=dc*(Math.ceil(dh/2)+1);
 if(!outlets && dc>0) outlets=dc;

 const totalDown=dc*dh;
 const names={zinc:'Titanzink',alu:'Aluminium',copper:'Kupfer',other:'Andere'};

 Rinnenstutzen: <b>${outlets} Stk.</b><br>

function addChimney(){
 const g=deriveSteepGeometry();
 const front=parseFloat(document.getElementById('chimFront')?.value)||0;

 chimneyState.items.push({front,back,left,right,h,side,fromLeft,fromEave});

function calcFixingLength(){
 const box=document.getElementById('fixResult');
 if(!box)return;
 if(!steepState.over || steepState.over==='none'){
   box.innerHTML='<b>Keine Aufsparrendämmung ausgewählt.</b>';
   return;
 }
 const ins=parseFloat(document.getElementById('overThick')?.value)||0;
 const sel=document.getElementById('counterBatten');
 let batten=sel?.value==='custom'?(parseFloat(document.getElementById('counterCustom')?.value)||0):(parseFloat(sel?.value)||0);
 const deck=parseFloat(document.getElementById('deckOverRafter')?.value)||0;
 const embed=parseFloat(document.getElementById('embedRafter')?.value)||0;
 const rafterDepth=parseFloat(document.getElementById('rafterDepth')?.value)||0;
 if(ins<=0||batten<=0||embed<=0){box.innerHTML='<b>Bitte Dämmstärke, Konterlattenhöhe und Verankerung eingeben.</b>';return;}
 if(rafterDepth>0 && embed>rafterDepth){
   box.innerHTML='<b>Fehler:</b> Die gewünschte Verankerung ist größer als die eingegebene Sparrenhöhe.';
   return;
 }
 const raw=ins+batten+deck+embed;
 const standard=[180,200,220,240,260,280,300,320,340,360,380,400,420,440,460,480,500];
 const next=standard.find(x=>x>=raw);
 box.innerHTML=`<b>Vorbemessung Schraubenlänge</b><br>
 Aufsparrendämmung: <b>${ins.toFixed(0)} mm</b><br>
 Konterlattenhöhe: <b>${batten.toFixed(0)} mm</b><br>
 Schalung / Platte: <b>${deck.toFixed(0)} mm</b><br>
 angenommene Verankerung im Sparren: <b>${embed.toFixed(0)} mm</b><br>
 Rechenlänge: <b>${raw.toFixed(0)} mm</b><br>
 ${next?`Nächste hinterlegte Schraubenlänge: <strong>${next} mm</strong>`:`Benötigt: <strong>mindestens ${raw.toFixed(0)} mm</strong> – passende Systemschraube prüfen.`}
 <br><br><span class="help"><b>Keine statische Befestigungsbemessung:</b> Durchmesser, Schraubenwinkel, Randabstände, Schraubenabstand und Stückzahl werden erst nach Hersteller-System, Dachneigung, Sparren, Lasten und Befestigungsnachweis festgelegt.</span>`;
}
function calcSteepU(){
 const rw=(parseFloat(document.getElementById('rafterWidth')?.value)||0)/1000;
 const rd=(parseFloat(document.getElementById('rafterDepth')?.value)||0)/1000;
 const spacing=(parseFloat(document.getElementById('rafterSpacing')?.value)||0)/1000;
 const target=parseFloat(document.getElementById('steepTargetU')?.value)||0.20;

 if(rw<=0||rd<=0||spacing<=rw){alert('Sparrenbreite, Sparrenhöhe und Sparrenabstand prüfen.');return}

 const woodFrac=Math.min(0.5,rw/spacing);
 const insFrac=1-woodFrac;
 const lambdaWood=0.13;
 const Rsi=0.10,Rse=0.04;

 // between rafters with parallel paths
 let RbetweenEff=0;
 if(steepState.between && steepState.between!=='none'){
   const t=(parseFloat(document.getElementById('betweenThick')?.value)||0)/1000;
   const li=steepLambda(steepState.between);
   if(t>0&&li>0){
     const Rins=t/li;
     const Rwood=t/lambdaWood;
     const Upar=insFrac/(Rsi+Rins+Rse)+woodFrac/(Rsi+Rwood+Rse);
     RbetweenEff=(1/Upar)-Rsi-Rse;
   }
 }

 let Runder=0;
 if(steepState.under && steepState.under!=='none'){
   const t=(parseFloat(document.getElementById('underThick')?.value)||0)/1000;
   const l=steepLambda(steepState.under);
   if(t>0&&l>0)Runder=t/l;
 }

 let Rover=0;
 if(steepState.over && steepState.over!=='none'){
   const t=(parseFloat(document.getElementById('overThick')?.value)||0)/1000;
   const l=steepLambda(steepState.over);
   if(t>0&&l>0)Rover=t/l;
 }

 const Rtotal=Rsi+RbetweenEff+Runder+Rover+Rse;
 const U=Rtotal>0?1/Rtotal:0;
 const box=document.getElementById('steepResult');
 if(!box)return;

 let status=U>0&&U<=target?'Zielwert erreicht':'Zielwert noch nicht erreicht';
 box.innerHTML=`<b>Steildach – energetische Vorberechnung</b><br>
 Sparren: <b>${(rw*1000).toFixed(0)} × ${(rd*1000).toFixed(0)} mm</b> · Achsabstand <b>${(spacing*1000).toFixed(0)} mm</b><br>
 Holzanteil im Sparrenfeld: <b>${(woodFrac*100).toFixed(1)} %</b><br>
 Zwischensparrendämmung: <b>${steepState.between||'nicht gewählt'}</b><br>

function initRectangleEdges(){
 const A=document.getElementById('A'),B=document.getElementById('B');
 if(!A||!B)return;
 A.addEventListener('input',renderRectangleEdges);
 B.addEventListener('input',renderRectangleEdges);
 renderRectangleEdges();
}

function renderRectangleEdges(){
 const box=document.getElementById('rectangleEdges'), totals=document.getElementById('rectangleEdgeTotals');
 if(!box||!totals)return;
 const A=m('A',false),B=m('B',false);
 if(!positive(A)||!positive(B)){
   box.innerHTML='';
   totals.textContent='Bitte zuerst A und B eingeben.';
   return;
 }
 const lengths=[B,A,B,A];
 const old=[...box.querySelectorAll('select')].map(x=>x.value);
 box.innerHTML=lengths.map((len,i)=>`<div class="edgeClassRow">
   <div><b>Seite ${i+1}</b> – ${len.toFixed(2)} m</div>
   <select class="edgeType" data-len="${len}">
     <option value="attika">Attika</option>
     <option value="traufe">Traufe / frei</option>
   </select>
 </div>`).join('');
 box.querySelectorAll('select').forEach((sel,i)=>{
   if(old[i])sel.value=old[i];
   sel.addEventListener('change',updateRectangleEdgeTotals);
 });
 updateRectangleEdgeTotals();
}

function updateRectangleEdgeTotals(){
 let attika=0,traufe=0;
 document.querySelectorAll('.edgeType').forEach(sel=>{
   const len=parseFloat(sel.dataset.len)||0;
   if(sel.value==='attika')attika+=len; else traufe+=len;
 });
 const totals=document.getElementById('rectangleEdgeTotals');
 if(totals)totals.innerHTML=`Attika automatisch: <b>${attika.toFixed(2)} m</b><br>Traufe / freier Dachrand automatisch: <b>${traufe.toFixed(2)} m</b>`;
 const at=document.getElementById('AT'),tr=document.getElementById('TR');
 if(at)at.value=attika?attika.toFixed(2):'';
 if(tr)tr.value=traufe?traufe.toFixed(2):'';
}

function drawPresetPlacement(){
  const svg=document.getElementById('presetPlaceSvg');
  if(!svg)return;
  const pts=presetShape(presetPlaceKind);
  let html='';

  // subtle fill
  html += `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(100,116,139,.08)" stroke="none"/>`;

  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length, a=pts[i], b=pts[j];
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    html += `<line class="placeEdge ${presetSelectedEdge===i?'selected':''}" data-edge="${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
    html += `<text class="placeLabel" x="${mx+7}" y="${my-7}">K${i+1}</text>`;
  }

  pts.forEach((p,i)=>{
    html += `<circle class="placePoint" cx="${p[0]}" cy="${p[1]}" r="6"/><text class="placeLabel" x="${p[0]+9}" y="${p[1]-9}">P${i+1}</text>`;
  });

  let g=0,a=0,v=0;
  presetObjects.forEach(o=>{
    const p=objectPixelPosition(o,pts);
    if(!p)return;
    if(o.tool==='area'){
      g++; html+=`<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="currentColor"/><text class="placeLabel" x="${p[0]+13}" y="${p[1]-10}">G${g}</text>`;
    }else if(o.tool==='attika'){
      a++; html+=`<rect x="${p[0]-11}" y="${p[1]-8}" width="22" height="16" fill="white" stroke="currentColor" stroke-width="4"/><text class="placeLabel" x="${p[0]+14}" y="${p[1]-10}">AG${a}</text>`;
    }else{
      v++; html+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="white" stroke="currentColor" stroke-width="3"/><text class="placeLabel" x="${p[0]+14}" y="${p[1]-10}">L${v}</text>`;
    }
  });

  svg.innerHTML=html;
  svg.querySelectorAll('.placeEdge').forEach(edge=>{
    edge.addEventListener('click',()=>{
      if(!presetPlaceTool){alert('Bitte zuerst Flächengully, Attikagully oder Lüfter auswählen.');return;}
      presetSelectedEdge=parseInt(edge.dataset.edge);
      const j=(presetSelectedEdge+1)%pts.length;
      document.getElementById('selectedEdgeText').textContent=`K${presetSelectedEdge+1}: von P${presetSelectedEdge+1} nach P${j+1}`;
      document.getElementById('placeInputs').classList.add('open');
      document.getElementById('inwardRow').style.display=presetPlaceTool==='attika'?'none':'grid';
      drawPresetPlacement();
    });
  });
}

function referenceEdgeLengthMeters(edgeIndex){
  // Prefer direct dimensional inputs when the edge clearly corresponds to an outside main dimension.
  const pts=presetShape(presetPlaceKind), a=pts[edgeIndex], b=pts[(edgeIndex+1)%pts.length];
  const horizontal=Math.abs(b[0]-a[0])>=Math.abs(b[1]-a[1]);
  let val=horizontal ? m('B',false) : m('A',false);
  if(!positive(val)){
    // fallback: drawn length interpreted through grid-like proportional scale
    val=Math.hypot(b[0]-a[0],b[1]-a[1])/30;
  }
  return val;
}

function addPresetObject(){
  if(presetSelectedEdge===null || !presetPlaceTool){alert('Bauteil und Kante auswählen.');return;}
  let along=m('alongDist',false);
  let inward=presetPlaceTool==='attika'?0:m('inwardDist',false);
  if(!positive(along)){alert('Abstand entlang der Kante eingeben.');return;}
  if(presetPlaceTool!=='attika' && (!Number.isFinite(inward)||inward<0)){alert('Abstand von der Kante ins Dach eingeben.');return;}

  const edgeLen=referenceEdgeLengthMeters(presetSelectedEdge);
  if(along>edgeLen){alert(`Der Abstand ist größer als die gewählte Kante (ca. ${edgeLen.toFixed(2)} m nach aktuellem Aufmaß).`);return;}

  presetObjects.push({tool:presetPlaceTool,edge:presetSelectedEdge,along,inward,edgeLen});
  document.getElementById('alongDist').value='';
  if(document.getElementById('inwardDist'))document.getElementById('inwardDist').value='';
  renderPresetObjectList();
  drawPresetPlacement();
}

function objectPixelPosition(o,pts){
  const a=pts[o.edge], b=pts[(o.edge+1)%pts.length];
  const dx=b[0]-a[0], dy=b[1]-a[1], pixLen=Math.hypot(dx,dy);
  if(pixLen===0)return null;
  const t=Math.max(0,Math.min(1,o.along/o.edgeLen));
  let x=a[0]+dx*t, y=a[1]+dy*t;

  if(o.tool!=='attika' && o.inward>0){
    // visual-only inward shift using normal vector; user-entered dimension remains authoritative
    const nx=-dy/pixLen, ny=dx/pixLen;
    const pxPerM=pixLen/o.edgeLen;
    let shift=o.inward*pxPerM;
    // choose inward direction by testing polygon center
    const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length;
    const cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
    const dot=(cx-x)*nx+(cy-y)*ny;
    const sign=dot>=0?1:-1;
    x+=nx*shift*sign; y+=ny*shift*sign;
  }
  return [x,y];
}

function renderPresetObjectList(){
  const box=document.getElementById('presetObjectList');
  if(!box)return;
  if(presetObjects.length===0){box.textContent='Noch keine Gullys oder Lüfter positioniert.';return;}
  let g=0,a=0,v=0;
  box.innerHTML=presetObjects.map((o,i)=>{
    let n='';
    if(o.tool==='area')n='G'+(++g)+' – Flächengully';
    else if(o.tool==='attika')n='AG'+(++a)+' – Attikagully';
    else n='L'+(++v)+' – Lüfter';
    return `${n}: K${o.edge+1}, ${o.along.toFixed(2)} m ab P${o.edge+1}${o.tool==='attika'?'':`, ${o.inward.toFixed(2)} m ins Dach`} <button type="button" data-i="${i}" class="delPreset">löschen</button>`;
  }).join('<br>');
  box.querySelectorAll('.delPreset').forEach(btn=>btn.addEventListener('click',()=>{
    presetObjects.splice(parseInt(btn.dataset.i),1);
    renderPresetObjectList(); drawPresetPlacement();
  }));
}

function labelForInput(el){

  const row=el.closest('.steepRow,.fixField,.field,.slopeField,.projectField,.buildLayerRow');
  if(row){
    const lab=row.querySelector('label');
    if(lab)return lab.textContent.trim();
    const divs=[...row.querySelectorAll('div')].map(x=>x.textContent.trim()).filter(Boolean);
    if(divs.length)return divs[divs.length-1];

function unitForInput(el){

  if(el.id==='steepTargetU') return ' W/(m²K)';
  if(el.closest('.compactField')){

    if(u)return ' '+u.textContent.trim();
  }
  if(el.type==='number' && ['A','B','C','F','G','L'].includes(el.id)) return ' '+U();

}

function collectVisibleSteepInputs(){
  const panel=document.querySelector('#measure .panel');
  if(!panel)return '';
  const exclude=['projectName','clientName','projectAddress','projectNote'];
  const seen=new Set();
  let rows='';
  [...panel.querySelectorAll('input,select')].forEach(el=>{
    if(exclude.includes(el.id))return;
    if(el.offsetParent===null)return;
    if(!el.value)return;
    if(el.id && seen.has(el.id))return;
    if(el.id)seen.add(el.id);
    let value=el.value;
    if(el.tagName==='SELECT'){
      const opt=el.options[el.selectedIndex];
      if(opt)value=opt.textContent.trim();
    }else{
      value+=unitForInput(el);
    }
    rows+=`<tr><td>${labelForInput(el)}</td><td>${value}</td></tr>`;
  });
  return rows;
}

function collectRoofReport(){
 const dims=(document.getElementById('A')||document.getElementById('B'))?getRoofDimensionsForSlope():{A:0,B:0};
 const typ=document.getElementById('insType')?.value||'–';
 const lambda=document.getElementById('insLambda')?.value||'–';
 const kpa=document.getElementById('insKpa')?.value||'–';
 const pct=document.getElementById('slopePct')?.value||'–';
 const minH=parseFloat(document.getElementById('minGullyH')?.value)||0;
 const base=parseFloat(document.getElementById('baseIns')?.value)||0;
 const target=parseFloat(document.getElementById('targetU')?.value)||0.20;
 const drains=getDrainObjectsForSlope();

 let run=drains.length?Math.max(dims.A,dims.B)/2:Math.max(dims.A,dims.B);
 let rise=run*((parseFloat(pct)||0)/100)*1000;
 let d1=(minH+base)/1000, d2=(minH+base+rise)/1000;
 let lam=parseFloat(lambda)||0.035;
 let rf=0.10+0.04+structureR()+existingInsR()+waterproofR();
 let ueff;
 if(Math.abs(d2-d1)<1e-9) ueff=1/(rf+d1/lam);
 else ueff=(lam/(d2-d1))*Math.log((rf+d2/lam)/(rf+d1/lam));

 const structureNames={concrete:'Betondecke',wood:'Holzbalkendecke',wooddeck:'Holzschalung / OSB',steel:'Trapezblech / Stahl'};
 const vaporNames={alu:'Alu-Dampfsperrbahn',bitvapor:'Bitumen-Dampfsperrbahn',pe:'PE-Dampfsperre',none:'keine / unbekannt'};
 const waterNames={bit1:'1 Lage Bitumen',bit2:'2 Lagen Bitumen',pvc:'PVC-Dachbahn',fpo:'FPO/TPO-Dachbahn',epdm:'EPDM',liquid:'Flüssigkunststoff'};

 let parts=[];
 if(typeof presetObjects!=='undefined' && presetObjects.length){
   let g=0,a=0,v=0;
   presetObjects.forEach(o=>{
     let name=o.tool==='area'?'G'+(++g)+' Flächengully':o.tool==='attika'?'AG'+(++a)+' Attikagully':'L'+(++v)+' Lüfter';
     parts.push(`${name}: K${o.edge+1}, ${o.along.toFixed(2)} m ab P${o.edge+1}${o.tool==='attika'?'':`, ${o.inward.toFixed(2)} m ins Dach`}`);
   });
 }
 if(typeof flatObjects!=='undefined' && flatObjects.length){
   let g=0,a=0,v=0;
   flatObjects.forEach(o=>{
     parts.push(o.type==='areaGully'?'G'+(++g)+' Flächengully':o.type==='attikaGully'?'AG'+(++a)+' Attikagully':'L'+(++v)+' Lüfter');
   });
 }

 return {
   projectName:document.getElementById('projectName')?.value?.trim()||'–',
   clientName:document.getElementById('clientName')?.value?.trim()||'–',
   projectAddress:document.getElementById('projectAddress')?.value?.trim()||'–',
   projectNote:document.getElementById('projectNote')?.value?.trim()||'',
   title: currentRoof||'Flachdach-Aufmaß',
   A: document.getElementById('A')?.value||'–',
   B: document.getElementById('B')?.value||'–',
   tr: valText('TR',' '+U()), at:valText('AT',' '+U()), ah:valText('AH',' '+U()), ab:valText('AB',' '+U()),
   structure:roofBuildState.structure?structureNames[roofBuildState.structure]:'nicht gewählt',
   vapor:roofBuildState.vapor.length?roofBuildState.vapor.map(v=>vaporNames[v]).join(', '):'nicht gewählt',
   waterproof:roofBuildState.waterproof.length?roofBuildState.waterproof.map(v=>waterNames[v]).join(', '):'nicht gewählt',
   insulation:roofBuildState.existingIns.length?roofBuildState.existingIns.join(', '):'keine gewählt',
   typ,lambda,kpa,pct,minH,base,rise,ueff,target,parts
 };
}


function validateProjectRequired(jumpToMissing=false){
 const fields=[
  ['projectName','errProjectName'],
  ['clientName','errClientName'],
  ['projectAddress','errProjectAddress']
 ];
 let ok=true, first=null;

 fields.forEach(([id,eid])=>{
   const el=document.getElementById(id);
   const err=document.getElementById(eid);
   const good=!!(el && el.value.trim());

   if(el)el.classList.toggle('validRequired',good);
   if(err)err.classList.toggle('show',!good);

   if(!good){
     ok=false;
     if(!first)first=el;
   }
 });

 // IMPORTANT:
 // Only move the cursor when the user explicitly tries to save/print/finish.
 // Never move focus while the user is typing.
 if(!ok && jumpToMissing && first){
   first.scrollIntoView({behavior:'smooth',block:'center'});
   first.focus();
 }
 return ok;
}

function structureR(){
 if(!roofBuildState.structure)return 0;
 const t=(parseFloat(document.getElementById('structThick')?.value)||0)/1000;
 const lambdaMap={concrete:2.30,wood:0.13,wooddeck:0.13,steel:50};
 return t/(lambdaMap[roofBuildState.structure]||1);
}

function existingInsR(){
 const lambdaMap={eps035:0.035,eps032:0.032,pir023:0.023,mw040:0.040,mw035:0.035,other:0.040};
 let R=0;
 document.querySelectorAll('.existingInsThick').forEach(inp=>{
   const t=(parseFloat(inp.value)||0)/1000;
   R += t/(lambdaMap[inp.dataset.type]||0.040);
 });
 return R;
}

function waterproofR(){
 // Membranes are thin; approximate thermal resistance only.
 let R=0;
 roofBuildState.waterproof.forEach(v=>{
   if(v==='bit1')R+=0.005;
   else if(v==='bit2')R+=0.010;
   else R+=0.005;
 });
 return R;
}

function calculateFullRoofU(){
 const slopeLambda=parseFloat(document.getElementById('insLambda')?.value)||0.035;
 const minH=parseFloat(document.getElementById('minGullyH')?.value)||0;
 const base=parseFloat(document.getElementById('baseIns')?.value)||0;
 const pct=parseFloat(document.getElementById('slopePct')?.value)||2;
 const dims=getRoofDimensionsForSlope();
 const drains=getDrainObjectsForSlope();
 let run=drains.length?Math.max(dims.A,dims.B)/2:Math.max(dims.A,dims.B);
 const rise=run*(pct/100)*1000;
 const d1=(minH+base)/1000;
 const d2=(minH+base+rise)/1000;

 const Rfixed=0.10+0.04+structureR()+existingInsR()+waterproofR();

 let Ueff;
 if(Math.abs(d2-d1)<1e-9){
   Ueff=1/(Rfixed+d1/slopeLambda);
 }else{
   Ueff=(slopeLambda/(d2-d1))*Math.log((Rfixed+d2/slopeLambda)/(Rfixed+d1/slopeLambda));
 }

 const Uthin=1/(Rfixed+d1/slopeLambda);
 const Uthick=1/(Rfixed+d2/slopeLambda);

 const structureNames={concrete:'Betondecke',wood:'Holzbalkendecke',wooddeck:'Holzschalung / OSB',steel:'Trapezblech / Stahl'};
 const vaporNames={alu:'Alu-Dampfsperrbahn',bitvapor:'Bitumen-Dampfsperrbahn',pe:'PE-Dampfsperre',none:'keine / unbekannt'};
 const waterNames={bit1:'1 Lage Bitumen',bit2:'2 Lagen Bitumen',pvc:'PVC-Dachbahn',fpo:'FPO/TPO-Dachbahn',epdm:'EPDM',liquid:'Flüssigkunststoff'};

 const box=document.getElementById('buildSummary');
 if(!box)return;
 box.innerHTML=`<b>Ausgewählter Dachaufbau</b><br>

function updateInsDefaults(){

function getRoofDimensionsForSlope(){
 let A=m('A',false), B=m('B',false);
 if(!positive(A))A=8;
 if(!positive(B))B=10;
 return {A,B};
}

function getDrainObjectsForSlope(){
 if(typeof presetObjects!=='undefined' && presetObjects.length){
   return presetObjects.filter(o=>o.tool==='area'||o.tool==='attika');
 }
 if(typeof flatObjects!=='undefined' && flatObjects.length){
   return flatObjects.filter(o=>o.type==='areaGully'||o.type==='attikaGully').map(o=>({tool:o.type==='areaGully'?'area':'attika',x:o.x,y:o.y}));
 }
 return [];
}

function calculateSlopePlan(){
 const pct=parseFloat(document.getElementById('slopePct').value)||2;
 const minH=parseFloat(document.getElementById('minGullyH').value)||0;
 const base=parseFloat(document.getElementById('baseIns').value)||0;
 const lambda=parseFloat(document.getElementById('insLambda').value);
 const typ=document.getElementById('insType').value;
 const kpa=document.getElementById('insKpa').value;
 const targetU=parseFloat(document.getElementById('targetU').value)||0.20;
 const dims=getRoofDimensionsForSlope();
 const drains=getDrainObjectsForSlope();

 if(!Number.isFinite(lambda)||lambda<=0){
   alert('Bitte einen gültigen λ-Wert auswählen.');
   return;
 }

 // Geometry estimate for current simple slope model.
 let run;
 if(drains.length>0) run=Math.max(dims.A,dims.B)/2;
 else run=Math.max(dims.A,dims.B);

 const rise=run*(pct/100)*1000;           // mm
 const minTotal=minH+base;                // mm
 const maxTotal=minH+rise+base;           // mm
 const avgThickness=(minTotal+maxTotal)/2;

 // Surface resistances for roof heat flow, simplified:
 // Rsi ≈ 0.10 and Rse ≈ 0.04 m²K/W.
 const Rsi=0.10, Rse=0.04, Rfixed=Rsi+Rse;

 const RminIns=(minTotal/1000)/lambda;
 const RmaxIns=(maxTotal/1000)/lambda;
 const Uthin=1/(Rfixed+RminIns);
 const Uthick=1/(Rfixed+RmaxIns);

 // Better effective U-value for a linearly varying insulation thickness:
 // average local transmittance over a linear taper.
 let Ueff;
 const d1=minTotal/1000, d2=maxTotal/1000;
 if(Math.abs(d2-d1)<1e-9){
   Ueff=1/(Rfixed+d1/lambda);
 } else {
   Ueff=(lambda/(d2-d1))*Math.log((Rfixed+d2/lambda)/(Rfixed+d1/lambda));
 }

 // Simple U based on arithmetic mean thickness for comparison only.
 const UavgSimple=1/(Rfixed+(avgThickness/1000)/lambda);

 // Required uniform insulation thickness for target U, with only selected insulation + surface resistances.
 let reqThickness=((1/targetU)-Rfixed)*lambda*1000;
 if(reqThickness<0) reqThickness=0;

 // Draw preliminary plan
 const plan=document.getElementById('slopePlan');
 plan.style.display='block';
 let svg=`<svg viewBox="0 0 520 330">
   <rect x="70" y="55" width="380" height="220" fill="none" stroke="currentColor" stroke-width="3"/>
   <text x="85" y="45" font-size="15" font-weight="800">Vorläufiger Gefälleplan ${pct.toFixed(1)} %</text>`;
 if(drains.length===0){
   svg+=`<circle cx="260" cy="165" r="12" fill="currentColor"/><text x="278" y="160" font-size="13" font-weight="800">Gully noch nicht positioniert</text>
   <path d="M110 90L245 155M410 90L275 155M110 240L245 175M410 240L275 175" stroke="currentColor" stroke-width="2"/>`;
 } else {
   drains.forEach((o,i)=>{
     let x=260,y=165;
     if(o.edge!==undefined && typeof presetShape==='function'){
       const pts=presetShape(presetPlaceKind), p=objectPixelPosition(o,pts);
       if(p){x=70+(p[0]-70)*0.84;y=55+(p[1]-55)*0.82;}
     } else if(o.x!==undefined){
       x=70+(o.x/500)*380;
       y=55+(o.y/420)*220;
     }
     svg+=`<circle cx="${x}" cy="${y}" r="11" fill="currentColor"/><text x="${x+14}" y="${y-8}" font-size="13" font-weight="800">${o.tool==='attika'?'AG':'G'}${i+1}</text>`;
   });
   svg+=`<text x="85" y="305" font-size="12">Gefällelinien werden zu den eingetragenen Entwässerungspunkten ausgerichtet.</text>`;
 }
 svg+=`</svg>`;
 plan.innerHTML=svg;

 let statusClass='bad', statusText='';
 if(Ueff<=targetU){
   statusClass='ok';
   statusText=`Ziel erreicht: Ueff ${Ueff.toFixed(3)} ≤ ${targetU.toFixed(2)} W/(m²K)`;
 } else if(Ueff<=targetU+0.05){
   statusClass='mid';
   statusText=`Knapp über Ziel: Ueff ${Ueff.toFixed(3)} W/(m²K)`;
 } else {
   statusClass='bad';
   statusText=`Ziel noch nicht erreicht: Ueff ${Ueff.toFixed(3)} > ${targetU.toFixed(2)} W/(m²K)`;
 }

 const res=document.getElementById('slopeResult');
 res.style.display='block';
 res.innerHTML=`
 <b>Gefälledämmung – energetische Auswertung</b><br>
 Dämmstoff: <b>${typ}</b>${kpa?` · ${kpa} kPa`:''}<br>
 λ-Wert: <b>${lambda.toFixed(3)} W/(m·K)</b><br>
 Gefälle: <b>${pct.toFixed(1)} %</b><br>
 Mindesthöhe am Gully: <b>${minH.toFixed(0)} mm</b><br>
 Grunddämmung: <b>${base.toFixed(0)} mm</b><br>
 Rechenweg bis Hochpunkt: <b>${run.toFixed(2)} m</b><br>
 Höhenzunahme durch Gefälle: <b>${rise.toFixed(0)} mm</b><br><br>

 <div class="energyMetrics">
   <div class="energyMetric"><div class="k">Dünnster Punkt</div><div class="v">${minTotal.toFixed(0)} mm</div></div>
   <div class="energyMetric"><div class="k">Dickster Punkt</div><div class="v">${maxTotal.toFixed(0)} mm</div></div>
   <div class="energyMetric"><div class="k">R-Wert dünnster Punkt</div><div class="v">${RminIns.toFixed(2)} m²K/W</div></div>
   <div class="energyMetric"><div class="k">R-Wert dickster Punkt</div><div class="v">${RmaxIns.toFixed(2)} m²K/W</div></div>
   <div class="energyMetric"><div class="k">U-Wert dünnster Punkt</div><div class="v">${Uthin.toFixed(3)}</div></div>
   <div class="energyMetric"><div class="k">U-Wert dickster Punkt</div><div class="v">${Uthick.toFixed(3)}</div></div>
   <div class="energyMetric"><div class="k">Effektiver U-Wert Gefälle</div><div class="v">${Ueff.toFixed(3)}</div></div>
   <div class="energyMetric"><div class="k">U aus mittlerer Stärke (Vergleich)</div><div class="v">${UavgSimple.toFixed(3)}</div></div>
 </div>

 <div class="energyStatus ${statusClass}">${statusText}</div>

 <br><b>Orientierung für Ziel ${targetU.toFixed(2)} W/(m²K):</b><br>
 Gleichmäßige Dämmstärke nur mit diesem Dämmstoff ungefähr: <b>${reqThickness.toFixed(0)} mm</b>.<br><br>

 <b>Hinweis:</b> Der effektive U-Wert wird hier für eine linear ansteigende Gefälledämmung zwischen dünnstem und dickstem Punkt berechnet. Für einen endgültigen U-Wert nach vollständigem Dachaufbau müssen weitere Schichten wie Tragkonstruktion, vorhandene Dämmung, Dampfsperre und ggf. Wärmebrücken berücksichtigt werden.`;
}

function calcSattelUnified(){
 let B=m('B',false), A=m('A',false), D=d('D');
 if(!positive(A)||!positive(B)||!positive(D)||D>=89){alert('A, B und D prüfen.');return}
 let E=(A/2)/Math.cos(D*Math.PI/180);
 let C=(A/2)*Math.tan(D*Math.PI/180);
 let side=B*E;
 show(`<b>Satteldach</b><br>A – Dachbreite: <b>${A.toFixed(2)} m</b><br>B – Dachlänge: <b>${B.toFixed(2)} m</b><br>C – Dachhöhe: <b>${C.toFixed(2)} m</b><br>D – Dachneigung: <b>${D.toFixed(2)}°</b><br>E – Sparrenlänge: <b>${E.toFixed(2)} m</b><br><strong>Gesamtfläche: ${(2*side).toFixed(2)} m²</strong>`);
}
function calcWalmUnified(){
 let B=m('B',false), A=m('A',false), D=d('D');
 if(!positive(A)||!positive(B)||!positive(D)||D>=89){alert('A, B und D prüfen.');return}
 let long=Math.max(A,B), short=Math.min(A,B), c=Math.cos(D*Math.PI/180);
 let C=(short/2)*Math.tan(D*Math.PI/180);
 let E=(short/2)/c;
 let ridge=Math.max(long-short,0);
 let total=A*B/c;
 show(`<b>Walmdach – regelmäßig</b><br>A – Dachbreite: <b>${A.toFixed(2)} m</b><br>B – Dachlänge: <b>${B.toFixed(2)} m</b><br>C – Dachhöhe: <b>${C.toFixed(2)} m</b><br>D – Dachneigung: <b>${D.toFixed(2)}°</b><br>E – Hauptsparrenlänge: <b>${E.toFixed(2)} m</b><br>Firstlänge: <b>${ridge.toFixed(2)} m</b><br><strong>Gesamtfläche: ${total.toFixed(2)} m²</strong>`);
}
function calcKrueppelUnified(){
 let B=m('B',false),A=m('A',false),C=m('C',false),F=m('F',false),G=m('G',false);
 if(!positive(A)||!positive(B)||!positive(C)||!positive(F)||F>=C||!positive(G)){alert('A, B, C, F und G prüfen.');return}
 let run=A/2, alpha=Math.atan(C/run), D=alpha*180/Math.PI, E=run/Math.cos(alpha), full=A*B/Math.cos(alpha);
 let y=(C-F)/Math.tan(alpha);
 if(y>run){alert('F ist geometrisch nicht plausibel.');return}
 let oldRidge=[0,0,C], low1=[0,y,F], low2=[0,-y,F], newRidge=[G,0,C];
 let remOne=triArea(oldRidge,low1,newRidge), hip=triArea(low1,low2,newRidge);
 let total=full-(4*remOne)+(2*hip);
 show(`<b>Krüppelwalmdach</b><br>A – Dachbreite: <b>${A.toFixed(2)} m</b><br>B – Dachlänge: <b>${B.toFixed(2)} m</b><br>C – Dachhöhe: <b>${C.toFixed(2)} m</b><br>D – errechnete Dachneigung: <b>${D.toFixed(2)}°</b><br>E – errechnete Sparrenlänge: <b>${E.toFixed(2)} m</b><br>F – Beginn Krüppelwalm: <b>${F.toFixed(2)} m</b><br>G – Krüppelwalmlänge: <b>${G.toFixed(2)} m</b><br><strong>Gesamtfläche: ${total.toFixed(2)} m²</strong>`);
}
function calcZeltUnified(){
 let B=m('B',false),A=m('A',false),C=m('C',false);
 if(!positive(A)||!positive(B)||!positive(C)){alert('A, B und C prüfen.');return}
 let eLong=Math.sqrt((A/2)**2+C**2);
 let eShort=Math.sqrt((B/2)**2+C**2);
 let areaLong=0.5*B*eLong, areaShort=0.5*A*eShort;

function calcMansard(){

function triArea(A,B,C){

let flatPoints=[], flatClosed=false;
let flatObjects=[], flatObjectTool=null;

function initFlatDrawer(){
  flatPoints=[]; flatClosed=false;
  const svg=document.getElementById('flatCanvas');
  const undo=document.getElementById('undoPoint');
  const clear=document.getElementById('clearPoints');
  const close=document.getElementById('closePolygon');
  const reopen=document.getElementById('reopenPolygon');
  const calc=document.getElementById('calcFlatDraw');
  const areaBtn=document.getElementById('toolAreaGully');
  const attikaBtn=document.getElementById('toolAttikaGully');
  const ventBtn=document.getElementById('toolVent');
  if(!svg)return;

  drawFlatGrid();

  svg.addEventListener('pointerdown', e=>{
    const pt=svg.createSVGPoint();
    pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());

    if(flatObjectTool && flatClosed){
      flatObjects.push({type:flatObjectTool,x:Math.max(25,Math.min(475,p.x)),y:Math.max(25,Math.min(395,p.y))});
      renderFlatShape();
      return;
    }

    if(flatClosed)return;
    const snap=25;
    const x=Math.round(p.x/snap)*snap;
    const y=Math.round(p.y/snap)*snap;
    if(x<25||x>475||y<25||y>395)return;
    flatPoints.push([x,y]);
    renderFlatShape();
  });

  undo.addEventListener('click',()=>{
    if(flatClosed)flatClosed=false;
    flatPoints.pop(); renderFlatShape();
  });
  clear.addEventListener('click',()=>{
    flatPoints=[]; flatClosed=false; flatObjects=[]; flatObjectTool=null; renderFlatShape();
  });
  close.addEventListener('click',()=>{
    if(flatPoints.length<3){alert('Mindestens 3 Eckpunkte setzen.');return;}
    flatClosed=true; renderFlatShape();
  });
  reopen.addEventListener('click',()=>{
    flatClosed=false; renderFlatShape();
  });
  calc.addEventListener('click',calcFlatDraw);
  function setObjTool(tool,btn){
    flatObjectTool=flatObjectTool===tool?null:tool;
    [areaBtn,attikaBtn,ventBtn].forEach(b=>{if(b)b.classList.remove('active')});
    if(flatObjectTool&&btn)btn.classList.add('active');
  }
  if(areaBtn)areaBtn.addEventListener('click',()=>setObjTool('areaGully',areaBtn));
  if(attikaBtn)attikaBtn.addEventListener('click',()=>setObjTool('attikaGully',attikaBtn));
  if(ventBtn)ventBtn.addEventListener('click',()=>setObjTool('vent',ventBtn));
}

function drawFlatGrid(){
  const svg=document.getElementById('flatCanvas');
  if(!svg)return;
  let grid='';
  for(let x=25;x<=475;x+=25) grid+=`<line x1="${x}" y1="25" x2="${x}" y2="395" stroke="#e5e7eb" stroke-width="1"/>`;
  for(let y=25;y<=395;y+=25) grid+=`<line x1="25" y1="${y}" x2="475" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
  svg.innerHTML=`<rect x="25" y="25" width="450" height="370" fill="white" stroke="#cbd5e1" stroke-width="1"/>${grid}<g id="flatShapeLayer"></g>`;
}

function renderFlatShape(){
  drawFlatGrid();
  const layer=document.getElementById('flatShapeLayer');
  const status=document.getElementById('flatStatus');
  if(!layer||!status)return;

  if(flatPoints.length===0){
    status.textContent='Noch keine Punkte gesetzt.';
    renderEdgeInputs();
    return;
  }

  let html='';
  const count=flatPoints.length;

  // individual line segments so each side can be highlighted / labelled
  for(let i=0;i<count-1;i++){
    const a=flatPoints[i], b=flatPoints[i+1];
    html+=`<line id="edgeSvg${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>`;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    html+=`<text x="${mx+7}" y="${my-7}" font-size="12" font-weight="700">K${i+1}</text>`;
  }

  if(flatClosed && count>=3){
    const a=flatPoints[count-1], b=flatPoints[0];
    const i=count-1;
    html+=`<line id="edgeSvg${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>`;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    html+=`<text x="${mx+7}" y="${my-7}" font-size="12" font-weight="700">K${i+1}</text>`;
    html+=`<polygon points="${flatPoints.map(p=>p.join(',')).join(' ')}" fill="rgba(100,116,139,.10)" stroke="none"/>`;
  }

  flatPoints.forEach((p,i)=>{
    html+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="currentColor"/><text x="${p[0]+9}" y="${p[1]-9}" font-size="13" font-weight="700">P${i+1}</text>`;
  });

  let gCount=0,aCount=0,vCount=0;
  flatObjects.forEach(o=>{
    if(o.type==='areaGully'){
      gCount++;
      html+=`<circle cx="${o.x}" cy="${o.y}" r="10" class="objGully"/><text x="${o.x+13}" y="${o.y-10}" font-size="13" font-weight="800">G${gCount}</text>`;
    }else if(o.type==='attikaGully'){
      aCount++;
      html+=`<rect x="${o.x-11}" y="${o.y-8}" width="22" height="16" rx="2" class="objAttika"/><text x="${o.x+14}" y="${o.y-10}" font-size="13" font-weight="800">AG${aCount}</text>`;
    }else{
      vCount++;
      html+=`<circle cx="${o.x}" cy="${o.y}" r="11" class="objVent"/><line x1="${o.x}" y1="${o.y-7}" x2="${o.x}" y2="${o.y+7}" stroke="currentColor" stroke-width="3"/><text x="${o.x+14}" y="${o.y-10}" font-size="13" font-weight="800">L${vCount}</text>`;
    }
  });

  layer.innerHTML=html;
  renderObjectList();
  status.innerHTML=`Eckpunkte: <b>${flatPoints.length}</b> · Kanten: <b>${flatClosed?flatPoints.length:Math.max(0,flatPoints.length-1)}</b> · Grundriss: <b>${flatClosed?'geschlossen':'offen'}</b>`;
  renderEdgeInputs();
}


function renderObjectList(){
 const box=document.getElementById('objectList');
 if(!box)return;
 if(flatObjects.length===0){box.textContent='Noch keine Gullys oder Lüfter gesetzt.';return;}
 let g=0,a=0,v=0,items=[];
 flatObjects.forEach((o,i)=>{
   let label='';
   if(o.type==='areaGully') label='G'+(++g)+' – Flächengully';
   else if(o.type==='attikaGully') label='AG'+(++a)+' – Attikagully';
   else label='L'+(++v)+' – Lüfter';
   items.push(`${label} <button type="button" data-obj="${i}" class="removeObj">löschen</button>`);
 });
 box.innerHTML=items.join('<br>');
 box.querySelectorAll('.removeObj').forEach(btn=>{
   btn.addEventListener('click',()=>{flatObjects.splice(parseInt(btn.dataset.obj),1);renderFlatShape();});
 });
}
function renderEdgeInputs(){
  const box=document.getElementById('edgeMeasures');
  if(!box)return;

  if(!flatClosed || flatPoints.length<3){
    box.innerHTML='';
    return;
  }

  // Preserve already entered values across redraws.
  const old={};
  box.querySelectorAll('.edgeInput').forEach(inp=>old[inp.dataset.edge]=inp.value);

  let html='<h3>Kantenmaße eingeben</h3><div class="edgeGrid">';
  for(let i=0;i<flatPoints.length;i++){
    const j=(i+1)%flatPoints.length;
    const a=flatPoints[i], b=flatPoints[j];
    const px=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const gInput=document.getElementById('gridSize');
    let gv=gInput&&gInput.value!==''?parseFloat(gInput.value):1;
    if(unit==='cm') gv=gv/100;
    const estimate=(px/25)*gv;
    const displayEstimate=unit==='cm' ? estimate*100 : estimate;
    const val=old[i]!==undefined?old[i]:displayEstimate.toFixed(unit==='cm'?0:2);

    html+=`<div class="edgeRow">
      <div class="edgeLabel">K${i+1}: P${i+1} → P${j+1}</div>
      <input class="edgeInput" data-edge="${i}" type="number" step="any" value="${val}" aria-label="Länge Kante ${i+1}">
      <div class="lenU">${unit}</div>
    </div>`;
  }
  html+='</div><div class="edgeHint">Trage hier die echten Aufmaßlängen ein. Die Richtung jeder Kante kommt aus deiner Zeichnung. Bei einer sauber geschlossenen U-, L- oder Polygonform sollten die Maße geometrisch wieder zusammenpassen.</div>';
  box.innerHTML=html;

  box.querySelectorAll('.edgeInput').forEach(inp=>{
    inp.addEventListener('focus',()=>{
      document.querySelectorAll('[id^="edgeSvg"]').forEach(el=>el.classList.remove('edgeActive'));
      const line=document.getElementById('edgeSvg'+inp.dataset.edge);
      if(line)line.classList.add('edgeActive');
    });
    inp.addEventListener('blur',()=>{
      const line=document.getElementById('edgeSvg'+inp.dataset.edge);
      if(line)line.classList.remove('edgeActive');
    });
  });
}

function getMeasuredEdgesMeters(){
  if(!flatClosed || flatPoints.length<3)return null;
  const inputs=[...document.querySelectorAll('.edgeInput')];
  if(inputs.length!==flatPoints.length)return null;
  let vals=[];
  for(const inp of inputs){
    let v=parseFloat(inp.value);
    if(!Number.isFinite(v)||v<=0)return null;
    if(unit==='cm')v/=100;
    vals.push(v);
  }
  return vals;
}

function reconstructMeasuredPolygon(){
  const lengths=getMeasuredEdgesMeters();
  if(!lengths)return null;

  // Use the direction of every drawn segment, but replace its drawn length
  // by the user's real measured length.
  let pts=[[0,0]];
  for(let i=0;i<flatPoints.length;i++){
    const j=(i+1)%flatPoints.length;
    const dx=flatPoints[j][0]-flatPoints[i][0];
    const dy=flatPoints[j][1]-flatPoints[i][1];
    const mag=Math.hypot(dx,dy);
    if(mag===0)return null;
    const ux=dx/mag, uy=dy/mag;
    const last=pts[pts.length-1];
    pts.push([last[0]+ux*lengths[i], last[1]+uy*lengths[i]]);
  }

  // Last generated point should return to origin if entered dimensions close.
  const closure=Math.hypot(pts[pts.length-1][0],pts[pts.length-1][1]);
  return {points:pts.slice(0,-1),closure,lengths};
}

function polygonAreaMeters(points){
  let sum=0;
  for(let i=0;i<points.length;i++){
    const j=(i+1)%points.length;
    sum+=points[i][0]*points[j][1]-points[j][0]*points[i][1];
  }
  return Math.abs(sum)/2;
}

function polygonAreaPixels(points){
  let sum=0;
  for(let i=0;i<points.length;i++){
    const j=(i+1)%points.length;
    sum+=points[i][0]*points[j][1]-points[j][0]*points[i][1];
  }
  return Math.abs(sum)/2;
}

function polygonPerimeterPixels(points){
  let sum=0;
  for(let i=0;i<points.length;i++){
    const j=(i+1)%points.length;
    const dx=points[j][0]-points[i][0],dy=points[j][1]-points[i][1];
    sum+=Math.sqrt(dx*dx+dy*dy);
  }
  return sum;
}

function calcFlatDraw(){
  if(!flatClosed||flatPoints.length<3){alert('Bitte den Grundriss zuerst schließen.');return;}

  const measured=reconstructMeasuredPolygon();
  if(!measured){
    alert('Bitte für jede Kante ein gültiges Maß eingeben.');
    return;
  }

  const area=polygonAreaMeters(measured.points);
  const perimeter=measured.lengths.reduce((a,b)=>a+b,0);
  const rise=m('rise');
  const tolerance=Math.max(0.02, perimeter*0.005);
  let closureText='';

  if(measured.closure>tolerance){
    closureText=`<br><span class="help"><b>Achtung:</b> Die eingegebenen Kantenmaße schließen geometrisch noch nicht exakt. Abweichung am letzten Punkt: <b>${measured.closure.toFixed(2)} m</b>. Bitte Maße oder Zeichnungsrichtung prüfen.</span>`;
  }else{
    closureText=`<br><span class="help">Geometrischer Schlussfehler: ${measured.closure.toFixed(2)} m – innerhalb der Prüftoleranz.</span>`;
  }

  let edgeText='<br><b>Kanten:</b><br>';
  measured.lengths.forEach((v,i)=>edgeText+=`K${i+1}: ${v.toFixed(2)} m${i<measured.lengths.length-1?' · ':''}`);

  let slopeNote='';
  if(rise>0){
    slopeNote='<br><span class="help">Der Gefälle-Höhenunterschied ist erfasst. Für die exakte geneigte Oberfläche bei einem unregelmäßigen Grundriss braucht die App zusätzlich die konkrete Gefällerichtung.</span>';
  }

  let gc=flatObjects.filter(o=>o.type==='areaGully').length, agc=flatObjects.filter(o=>o.type==='attikaGully').length, vc=flatObjects.filter(o=>o.type==='vent').length;
  show(`<b>Flachdach – frei gezeichnet</b><br>Eckpunkte: <b>${flatPoints.length}</b><br>Umfang aus echten Kantenmaßen: <b>${perimeter.toFixed(2)} m</b>${edgeText}<br><strong>Grundfläche aus Zeichnungsrichtungen + Kantenmaßen: ${area.toFixed(2)} m²</strong><br><br><b>Einbauteile</b><br>Flächengullys: <b>${gc}</b><br>Attikagullys: <b>${agc}</b><br>Lüfter: <b>${vc}</b>${closureText}${slopeNote}${flatExtrasResult()}`);
}
function calcFlat(){
 let r=effRect();if(!r)return;let rise=m('rise'),dir=document.getElementById('dir').value,run=dir==='B'?r.B:r.L;
 let factor=1;
 if(rise>0)factor=Math.sqrt(run*run+rise*rise)/run;
 let area=r.L*r.B*factor;
 show(`<b>Flachdach</b><br>Wirksame Dachmaße: <b>${r.L.toFixed(2)} × ${r.B.toFixed(2)} m</b><br>${rise>0?`Höhenunterschied: <b>${rise.toFixed(2)} m</b><br>`:''}<strong>Dachfläche: ${area.toFixed(2)} m²</strong>`);
}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const b=document.getElementById('installAppBtn');
  if(b)b.classList.add('show');
});
document.addEventListener('click',async e=>{
  if(e.target && e.target.id==='installAppBtn'){

    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice;}catch(_){}
    deferredInstallPrompt=null;
    e.target.classList.remove('show');
  }
});
